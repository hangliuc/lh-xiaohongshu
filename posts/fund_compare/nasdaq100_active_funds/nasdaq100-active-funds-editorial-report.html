<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080" />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
:root {
  --paper: #ffffff;
  --paper-soft: #fafbfc;
  --ink: #0a2342;
  --ink-soft: #1a3556;
  --slate: #2a3f5f;
  --slate-soft: #3a4f6f;
  --rule: #b8bec8;
  --rule-soft: #d8dce2;
  --red: #c8252c;
  --red-deep: #9a1c22;
  --green: #1a7a4a;
  --green-deep: #155c38;
  --rust: #8a3018;
  --gold: #6a5a1a;
}
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
html, body {
  background: var(--paper);
  font-family: 'Inter', sans-serif;
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "kern" 1, "tnum" 1;
}
.card {
  width: 1080px;
  height: 1440px;
  position: relative;
  background: var(--paper);
  overflow: hidden;
}

/* Hairline frame */
.frame {
  position: absolute;
  top: 40px;
  left: 40px;
  right: 40px;
  bottom: 40px;
  border: 0.5px solid var(--rule);
  z-index: 2;
  pointer-events: none;
}

/* Top masthead */
.masthead {
  position: relative;
  z-index: 5;
  padding: 70px 80px 0;
}
.masthead-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  padding-bottom: 14px;
  border-bottom: 1.5px solid var(--ink);
  margin-bottom: 24px;
}
.masthead-left {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.org-mark {
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.28em;
  color: var(--ink);
  text-transform: uppercase;
}
.org-mark .accent {
  color: var(--red);
}
.doc-class {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--slate);
  letter-spacing: 0.18em;
  text-transform: uppercase;
}
.masthead-right {
  display: flex;
  flex-direction: column;
  gap: 5px;
  text-align: right;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--slate);
  letter-spacing: 0.14em;
  text-transform: uppercase;
}
.masthead-right .meta-row {
  display: flex;
  gap: 14px;
  justify-content: flex-end;
}
.masthead-right .meta-row .lbl {
  color: var(--slate-soft);
}
.masthead-right .meta-row .val {
  color: var(--ink);
}

/* Title block */
.title-block {
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding-bottom: 22px;
  border-bottom: 0.5px solid var(--rule);
}
.title-eyebrow {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  letter-spacing: 0.32em;
  color: var(--red);
  text-transform: uppercase;
  font-weight: 500;
}
h1.title {
  font-family: 'Source Serif 4', serif;
  font-weight: 600;
  font-size: 56px;
  line-height: 1.12;
  color: var(--ink);
  letter-spacing: -0.005em;
}
.title-meta {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-top: 4px;
  font-family: 'Inter', sans-serif;
  font-size: 16px;
  color: var(--ink-soft);
  letter-spacing: 0.04em;
}
.title-meta .meta-left {
  font-weight: 400;
}
.title-meta .meta-left .sep {
  color: var(--rule);
  margin: 0 10px;
}
.title-meta .meta-right {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  color: var(--ink-soft);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  font-weight: 500;
}

/* Column legend */
.legend {
  position: relative;
  z-index: 5;
  margin: 0 60px;
  padding: 20px 0 14px;
  display: grid;
  grid-template-columns: 28px 175px 95px 78px 1.2fr 1fr;
  gap: 14px;
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.14em;
  color: var(--ink);
  text-transform: uppercase;
  border-bottom: 1px solid var(--ink);
}
.legend .l-num { text-align: left; }
.legend .l-name { text-align: left; }
.legend .l-ret { text-align: right; }
.legend .l-dd { text-align: right; }
.legend .l-mkt { text-align: left; }
.legend .l-hold { text-align: left; }

/* Fund table */
.atlas {
  position: relative;
  z-index: 5;
  margin: 0 60px;
}
.entry {
  display: grid;
  grid-template-columns: 28px 175px 95px 78px 1.2fr 1fr;
  gap: 14px;
  align-items: center;
  padding: 11px 0;
  border-bottom: 0.5px solid var(--rule-soft);
  position: relative;
  min-height: 50px;
}
.entry .num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  font-weight: 500;
  color: var(--ink-soft);
  letter-spacing: 0.05em;
}
.entry .name-block {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
}
.entry .name {
  font-family: 'Source Serif 4', serif;
  font-size: 19px;
  font-weight: 600;
  line-height: 1.18;
  color: var(--ink);
  letter-spacing: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.entry .code {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--ink-soft);
  letter-spacing: 0.1em;
  font-weight: 500;
}
.entry .ret {
  font-family: 'JetBrains Mono', monospace;
  font-size: 19px;
  font-weight: 600;
  color: var(--red);
  text-align: right;
  line-height: 1;
  letter-spacing: -0.01em;
  white-space: nowrap;
}
.entry .ret .pct {
  font-size: 15px;
  font-weight: 500;
  color: var(--red-deep);
  margin-left: 1px;
}
.entry .dd {
  font-family: 'JetBrains Mono', monospace;
  font-size: 15px;
  color: var(--green);
  text-align: right;
  letter-spacing: 0.02em;
  white-space: nowrap;
  font-weight: 600;
}
.entry .dd .arrow {
  color: var(--green-deep);
  margin-right: 2px;
  font-weight: 500;
}
.entry .mkt-block {
  display: flex;
  flex-direction: column;
  gap: 0;
  min-width: 0;
  justify-content: center;
}

.entry .mkt-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  color: var(--ink);
  letter-spacing: 0.01em;
  line-height: 1.4;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-weight: 500;
}
.entry .mkt-label .pct-mark {
  color: var(--ink);
}
.entry .hold-block {
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  color: var(--ink);
  letter-spacing: 0.01em;
  line-height: 1.4;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-weight: 500;
}
.entry .hold-block .hn {
  color: var(--ink);
  font-weight: 600;
}
.entry .hold-block .sep {
  color: var(--rule);
  margin: 0 4px;
}

/* Footer / colophon */
.colophon {
  position: absolute;
  bottom: 56px;
  left: 80px;
  right: 80px;
  z-index: 5;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.colophon .rule-top {
  height: 1px;
  background: var(--ink);
  margin-bottom: 4px;
}
.colophon .row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  color: var(--ink-soft);
  letter-spacing: 0.06em;
}
.colophon .row .source {
  color: var(--ink);
  font-weight: 600;
}
.colophon .row .source .src-mark {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--ink-soft);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  margin-right: 8px;
  font-weight: 500;
}
.colophon .row .meta-r {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  color: var(--ink-soft);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 500;
}
.colophon .disclaimer {
  font-family: 'Inter', sans-serif;
  font-size: 11px;
  color: var(--ink-soft);
  text-align: center;
  letter-spacing: 0.04em;
  margin-top: 2px;
  line-height: 1.5;
}

/* Footer page marker */
.page-marker {
  position: absolute;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.22em;
  color: var(--ink-soft);
  text-transform: uppercase;
  z-index: 5;
}

/* Folio in corners */
.folio {
  position: absolute;
  z-index: 5;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.18em;
  color: var(--ink-soft);
  text-transform: uppercase;
  font-weight: 500;
}
.folio.bl {
  bottom: 30px;
  left: 80px;
}
.folio.br {
  bottom: 30px;
  right: 80px;
  text-align: right;
}
</style>
</head>
<body>
<div class="card" id="p1">

  <div class="frame"></div>

  <header class="masthead">
    <div class="title-block">
      <div class="title-eyebrow">NASDAQ 100 · QDII ACTIVE FUNDS · 2026 Q2 REPORT</div>
      <h1 class="title">热门纳斯达克100主动基金<br>最新持仓分析</h1>
      <div class="title-meta">
        <div class="meta-left">按近1年收益率排序<span class="sep">·</span>收益 · 回撤 · 市场分布 · 持仓</div>
        <div class="meta-right">SPECIMENS · N = 18</div>
      </div>
    </div>
  </header>

  <div class="legend">
    <div class="l-num">№</div>
    <div class="l-name">基金名称 / 代码</div>

  <div class="folio br">PAGE 01 / 01</div>

  <div class="colophon">
    <div class="rule-top"></div>

      <div class="source"><span class="src-mark">SOURCE</span>2026第二季度报告 · 数据来自证监会</div>

    </div>
    <div class="disclaimer">
      本内容仅作信息分享，不构成任何投资建议；如有侵权请联系删除
    </div>
  </div>

</div>

<script>
const funds = [
  { code:"012922", display_name:"易方达全球成长精选", return_1y:"123.97", drawdown_1y:"27.16", purchase_limit:"暂停申购", holdings:["拉姆研究","KIOXIA","台积电"], mkt:[["us",42.76],["cn",28.54],["jp",8.53]] },
  { code:"017731", display_name:"嘉实全球产业升级", return_1y:"106.18", drawdown_1y:"22.73", purchase_limit:"100", holdings:["超威半导体","美光科技","科磊"], mkt:[["cn",42.56],["us",32.63],["hk",8.42]] },
  { code:"016665", display_name:"天弘全球高端制造", return_1y:"100.59", drawdown_1y:"32.53", purchase_limit:"100", holdings:["铠侠控股","胜宏科技","中际旭创"], mkt:[["cn",38.93],["us",24.23],["hk",8.59]] },
  { code:"539002", display_name:"建信新兴市场混合", return_1y:"93.66", drawdown_1y:"23.17", purchase_limit:"100", holdings:["台积电","英伟达","SK海力士"], mkt:[["us",59.65],["kr",17.51],["tw",2.33]] },
  { code:"002891", display_name:"华夏移动互联", return_1y:"87.16", drawdown_1y:"27.98", purchase_limit:"500", holdings:["美光科技","闪迪","Onto Innovation"], mkt:[["us",63.23],["cn",13.48],["jp",9.04]] },
  { code:"021662", display_name:"国富亚洲机会", return_1y:"87.04", drawdown_1y:"19.45", purchase_limit:"200", holdings:["SK海力士","三星电子","台积电"], mkt:[["kr",20.43],["tw",20.21],["hk",18.44]] },
  { code:"021842", display_name:"国富全球科技", return_1y:"73.85", drawdown_1y:"21.24", purchase_limit:"10", holdings:["美光科技","MKS Inc","台积电"], mkt:[["us",71.95],["jp",8.74],["hk",3.47]] },
  { code:"022184", display_name:"富国全球科技互联网", return_1y:"70.90", drawdown_1y:"20.62", purchase_limit:"1000", holdings:["ASMPT","兆易创新","闪迪"], mkt:[["hk",50.31],["us",17.85],["cn",10.31]] },
  { code:"018036", display_name:"长城全球新能源车", return_1y:"56.91", drawdown_1y:"16.40", purchase_limit:"10万", holdings:["台积电","美光科技","博通"], mkt:[["us",74.62],["cn",8.47],["kr",5.16]] },
  { code:"014002", display_name:"浦银安盛全球智能科技", return_1y:"52.60", drawdown_1y:"28.19", purchase_limit:"暂停申购", holdings:["闪迪","KIOXIA","美光科技"], mkt:[["us",73.31],["jp",9.61],["kr",7.59]] },
  { code:"008254", display_name:"华宝致远混合", return_1y:"52.54", drawdown_1y:"23.49", purchase_limit:"1000", holdings:["闪迪","美光科技","拉姆研究"], mkt:[["us",78.73],["hk",2.57]] },
  { code:"024239", display_name:"华夏全球科技先锋", return_1y:"44.59", drawdown_1y:"33.40", purchase_limit:"5000", holdings:["闪迪","美光科技","迈威尔科技"], mkt:[["cn",36.61],["hk",23.17],["us",16.66]] },
  { code:"021277", display_name:"广发全球精选", return_1y:"42.03", drawdown_1y:"20.22", purchase_limit:"200", holdings:["智谱","美光科技","拉姆研究"], mkt:[["us",46.65],["cn",17.43],["hk",12.81]] },
  { code:"017093", display_name:"景顺长城纳斯达克科技", return_1y:"28.80", drawdown_1y:"17.47", purchase_limit:"暂停申购", holdings:["微软","苹果","英伟达"], mkt:[["us",97.97]] },
  { code:"016702", display_name:"银华海外数字经济", return_1y:"27.49", drawdown_1y:"18.20", purchase_limit:"1000", holdings:["英伟达","谷歌-A","苹果"], mkt:[["us",87.89],["hk",2.55]] },
  { code:"015202", display_name:"汇添富全球移动互联", return_1y:"21.89", drawdown_1y:"16.13", purchase_limit:"700", holdings:["英伟达","谷歌-A","美光科技"], mkt:[["us",92.77],["hk",1.77]] },
  { code:"161128", display_name:"易方达标普信息科技", return_1y:"18.90", drawdown_1y:"18.87", purchase_limit:"暂停申购", holdings:["英伟达","苹果","微软"], mkt:[["us",91.31]] },
  { code:"017204", display_name:"华宝海外科技", return_1y:"18.08", drawdown_1y:"17.67", purchase_limit:"20", holdings:["ETF间接投资"], mkt:[] },
  { code:"000043", display_name:"嘉实美国成长", return_1y:"17.38", drawdown_1y:"14.86", purchase_limit:"100", holdings:["苹果","英伟达","谷歌-A"], mkt:[["us",94.94]] },
  { code:"017437", display_name:"华宝纳斯达克精选", return_1y:"7.51", drawdown_1y:"20.44", purchase_limit:"1000", holdings:["英伟达","迈威尔科技","苹果"], mkt:[["us",89.84]] }
].filter(f => !['华宝海外科技','华宝纳斯达克精选'].includes(f.display_name));

const atlas = document.getElementById('atlas');

const regionLabel = (k) => ({
  us: '美', cn: 'A股', hk: '港', jp: '日', kr: '韩', tw: '台', de: '德', nl: '荷', other: '其他'
}[k] || k);

funds.forEach((f, i) => {
  const mktLabel = f.mkt.length === 0
    ? '— · — · —'
    : f.mkt.slice(0, 3).map(([k, v]) => `${regionLabel(k)} ${v.toFixed(1)}<span class="pct-mark">%</span>`).join(' · ');

  const holdHtml = f.holdings.map(n => `<span class="hn">${n}</span>`).join('<span class="sep">·</span>');

  const entry = document.createElement('div');
  entry.className = 'entry';
  entry.innerHTML = `
    <div class="num">${String(i + 1).padStart(2, '0')}</div>
    <div class="name-block">
      <div class="name">${f.display_name}</div>
      <div class="code">${f.code}</div>
    </div>
    <div class="ret">${f.return_1y}<span class="pct">%</span></div>
    <div class="dd"><span class="arrow">↓</span>${f.drawdown_1y}%</div>
    <div class="mkt-block">
      <div class="mkt-label">${mktLabel}</div>
    </div>
    <div class="hold-block">${holdHtml}</div>
  `;
  atlas.appendChild(entry);
});

requestAnimationFrame(() => {
  const atlas = document.querySelector('.atlas');
  const colophon = document.querySelector('.colophon');
  const atlasTop = atlas.getBoundingClientRect().top;
  const colophonTop = colophon.getBoundingClientRect().top;
  const availH = colophonTop - atlasTop - 20;

  const entries = atlas.querySelectorAll('.entry');
  const n = entries.length;
  const targetRowH = availH / n;

  entries.forEach(e => {
    e.style.height = targetRowH + 'px';
  });
});
</script>
</body>
</html>
